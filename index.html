<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppHub — Accedi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">&#9638;</span> AppHub
      </div>
      <h1>Accedi al portale</h1>
      <p class="login-subtitle">Inserisci le tue credenziali per continuare.</p>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="username">Utente</label>
          <input type="text" id="username" placeholder="nome.utente" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword()">&#128065;</button>
          </div>
        </div>
        <div class="login-options">
          <label class="remember">
            <input type="checkbox" id="remember" /> Ricordami
          </label>
          <a href="#" class="forgot">Password dimenticata?</a>
        </div>
        <button type="submit" class="btn-login">Accedi</button>
        <p class="error-msg" id="error-msg"></p>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
